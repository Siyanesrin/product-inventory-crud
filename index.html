<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <input type="text" id="editstatus" hidden>
        <form id="productform" action="">
            <h1 class="text-center text-primary my-5">Product Inventory App</h1>
            <div class="row">
                <div class="col-6 my-3"><input type="text" class="form-control" placeholder="Product ID" id="pid"></div>
                <div class="col-6 my-3"><input type="text" class="form-control" placeholder="Product Name" id="pname"></div>
                <div class="col-6"><input type="text" class="form-control" placeholder="Price" id="pprice"></div>
                <div class="col-6"><input type="text" class="form-control" placeholder="Quantity" id="pquantity"></div>
            </div>
            <div class="d-flex align-items-center justify-content-center text-center my-3 " style="width: 250px;"><button class="btn btn-success w-100">Add</button></div>
        </form>
        <table class="table table-stripped">
            <thead>
                <tr>
                    <th>product ID</th>
                    <th>product Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody id="tablebody">
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>

    </div>
</body>
<script src="main.js"></script>
</html>
